<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>摩斯密碼發報機 V2</title>
<style>
  :root {
    --green: #00ff88; --dark-green: #00cc66; --bg: #050f0a; --panel: #0a1f14; --border: #0d3320; --text: #c8ffe0; --dim: #3a6b50;
  }
  body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  .container { width: 100%; max-width: 420px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 15px; margin-bottom: 15px; }
  .btn { background: transparent; border: 1px solid var(--green); color: var(--green); padding: 10px; cursor: pointer; width: 100%; margin-top: 10px; }
  .display { background: #000; border: 1px solid var(--border); padding: 20px; text-align: center; font-size: 24px; color: var(--green); min-height: 40px; margin-bottom: 15px; }
</style>
</head>
<body>
<div class="container">
  <h2>MORSE TX V2</h2>
  <div class="panel">
    <button class="btn" id="btnConnect" onclick="connect()">連接 micro:bit</button>
    <p id="status" style="font-size:12px; color:gray;">狀態: 未連線</p>
  </div>
  <div class="display" id="morseDisplay">_</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
    <button class="btn" onclick="add('.')">點 (DOT)</button>
    <button class="btn" onclick="add('-')">劃 (DASH)</button>
  </div>
  <button class="btn" style="background:rgba(0,255,136,0.1)" onclick="send()">▶ 發送訊息</button>
  <button class="btn" style="border-color: #555; color: #555;" onclick="clearMsg()">清除</button>
</div>

<script>
let sequence = "";
let characteristic = null;
const UART_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const UART_TX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

async function connect() {
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'BBC micro:bit' }],
      optionalServices: [UART_SERVICE]
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE);
    characteristic = await service.getCharacteristic(UART_TX_CHAR);
    document.getElementById('status').innerText = "狀態: 已連線";
  } catch (e) { console.error(e); }
}

function add(s) { sequence += s; document.getElementById('morseDisplay').innerText = sequence; }
function clearMsg() { sequence = ""; document.getElementById('morseDisplay').innerText = "_"; }

async function send() {
  if (!characteristic || !sequence) return;
  const encoder = new TextEncoder();
  await characteristic.writeValue(encoder.encode(sequence + '\n'));
  clearMsg();
}
</script>
</body>
</html>
